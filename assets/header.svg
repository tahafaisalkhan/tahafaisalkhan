<svg width="1400" height="280" viewBox="0 0 1400 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0d1117"/>
      <stop offset="0.5" stop-color="#111827"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>

    <radialGradient id="glowLeft" cx="0" cy="0" r="1" gradientTransform="translate(220 80) rotate(25) scale(360 220)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowRight" cx="0" cy="0" r="1" gradientTransform="translate(1180 190) rotate(-155) scale(340 220)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c084fc" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="accent" x1="380" y1="0" x2="1020" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#84cc16"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>

    <filter id="starGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softTextGlow" x="-50%" y="-100%" width="200%" height="300%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1400" height="280" rx="18" fill="url(#bg)"/>
  <rect width="1400" height="280" rx="18" fill="url(#glowLeft)"/>
  <rect width="1400" height="280" rx="18" fill="url(#glowRight)"/>

  <!-- subtle grid -->
  <g opacity="0.045" stroke="#ffffff">
    <path d="M0 56H1400"/>
    <path d="M0 112H1400"/>
    <path d="M0 168H1400"/>
    <path d="M0 224H1400"/>
    <path d="M140 0V280"/>
    <path d="M280 0V280"/>
    <path d="M420 0V280"/>
    <path d="M560 0V280"/>
    <path d="M700 0V280"/>
    <path d="M840 0V280"/>
    <path d="M980 0V280"/>
    <path d="M1120 0V280"/>
    <path d="M1260 0V280"/>
  </g>

  <!-- left constellation -->
  <g stroke="#22d3ee" stroke-width="1.4" opacity="0.55">
    <path d="M55 88L130 42L205 94L275 54L350 112L420 72"/>
    <path d="M130 42L166 150L238 198L350 112"/>
    <path d="M205 94L238 198"/>
    <path d="M55 88L90 190L166 150"/>
  </g>

  <!-- right constellation -->
  <g stroke="#c084fc" stroke-width="1.4" opacity="0.55">
    <path d="M980 60L1060 105L1135 58L1215 118L1315 72"/>
    <path d="M1060 105L1105 190L1215 118L1275 208"/>
    <path d="M1135 58L1168 170L1275 208"/>
    <path d="M1315 72L1360 152L1275 208"/>
  </g>

  <!-- constellation stars -->
  <g filter="url(#starGlow)">
    <g fill="#22d3ee">
      <circle cx="55" cy="88" r="3.5"/>
      <circle cx="130" cy="42" r="4"/>
      <circle cx="205" cy="94" r="3"/>
      <circle cx="275" cy="54" r="3.5"/>
      <circle cx="350" cy="112" r="4"/>
      <circle cx="420" cy="72" r="3"/>
      <circle cx="90" cy="190" r="3"/>
      <circle cx="166" cy="150" r="3.5"/>
      <circle cx="238" cy="198" r="3"/>
    </g>

    <g fill="#c084fc">
      <circle cx="980" cy="60" r="3"/>
      <circle cx="1060" cy="105" r="4"/>
      <circle cx="1135" cy="58" r="3.5"/>
      <circle cx="1215" cy="118" r="4"/>
      <circle cx="1315" cy="72" r="3"/>
      <circle cx="1105" cy="190" r="3"/>
      <circle cx="1168" cy="170" r="3.5"/>
      <circle cx="1275" cy="208" r="4"/>
      <circle cx="1360" cy="152" r="3"/>
    </g>

    <g fill="#84cc16">
      <circle cx="470" cy="32" r="2.5"/>
      <circle cx="520" cy="220" r="2"/>
      <circle cx="890" cy="42" r="2"/>
      <circle cx="930" cy="226" r="2.5"/>
    </g>
  </g>

  <!-- small ambient stars -->
  <g fill="#ffffff" opacity="0.5">
    <circle cx="28" cy="35" r="1.2"/>
    <circle cx="318" cy="232" r="1"/>
    <circle cx="452" cy="166" r="1.2"/>
    <circle cx="505" cy="88" r="1"/>
    <circle cx="860" cy="198" r="1.1"/>
    <circle cx="945" cy="128" r="1"/>
    <circle cx="1040" cy="238" r="1.2"/>
    <circle cx="1380" cy="36" r="1"/>
  </g>

  <!-- title -->
  <text x="700" y="108"
        text-anchor="middle"
        font-family="'Fira Code', 'Courier New', monospace"
        font-size="56"
        font-weight="700"
        letter-spacing="1.5"
        fill="#ffffff"
        filter="url(#softTextGlow)">
    Taha Faisal Khan
  </text>

  <!-- accent line -->
  <line x1="410" y1="134" x2="990" y2="134"
        stroke="url(#accent)"
        stroke-width="3"
        stroke-linecap="round"/>

  <circle cx="700" cy="134" r="4" fill="#22d3ee" filter="url(#starGlow)"/>

  <!-- subtitle -->
  <text x="700" y="177"
        text-anchor="middle"
        font-family="Inter, Arial, sans-serif"
        font-size="18"
        fill="#c9d1d9">
    A curated collection of my academic, professional, and research repositories,
  </text>

  <text x="700" y="207"
        text-anchor="middle"
        font-family="Inter, Arial, sans-serif"
        font-size="18"
        fill="#c9d1d9">
    spanning artificial intelligence, machine learning, generative AI, and software development.
  </text>
</svg>
